# Publishes web/ to Cloudflare as the sydmap Worker (static assets), at https://sydmap.thethirdscript.com/.
# Runs the same `wrangler deploy` as by hand, with wrangler.jsonc. Needs two repository secrets
# (Settings › Secrets and variables › Actions): CLOUDFLARE_API_TOKEN (a token with Workers Scripts: Edit and
# Workers Routes: Edit on thethirdscript.com) and CLOUDFLARE_ACCOUNT_ID.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
    paths: ["web/**", "wrangler.jsonc", ".github/workflows/deploy.yml"]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
