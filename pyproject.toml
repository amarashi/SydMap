[project]
name = "sydmap-pipeline"
version = "0.1.0"
description = "Sydney, building by building: the data pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "geopandas>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "pyogrio>=0.10",
    "pyproj>=3.6",
    "requests>=2.32",
    "rustgis>=0.2.0",
    "scipy>=1.14",
    "shapely>=2.0",
    "tqdm>=4.66",
]

[tool.uv]
package = false
