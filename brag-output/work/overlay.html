<!doctype html>
<meta charset="utf-8">
<style>
  @font-face { font-family: Cormorant; src: url(../../web/fonts/cormorant-garamond-latin.woff2) format('woff2'); }
  @font-face { font-family: Cormorant; font-style: italic; src: url(../../web/fonts/cormorant-garamond-italic-latin.woff2) format('woff2'); }
  @font-face { font-family: InterS; src: url(../../web/fonts/inter-latin.woff2) format('woff2'); }
  html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
  .halo { position: absolute; left: 50%; top: 50%; width: 1500px; height: 520px; transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(255,255,255,.9) 0%, rgba(255,255,255,.72) 35%, rgba(255,255,255,0) 70%); }
  .line { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
    font: 400 82px/1.1 Cormorant, Georgia, serif; color: #2c2f2a; letter-spacing: .005em; }
  .name { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-84%); text-align: center;
    font: 400 150px/1 Cormorant, Georgia, serif; color: #2c2f2a; letter-spacing: .01em; }
  .name i { font-style: normal; display: inline-block; width: .24em; height: .24em; border-radius: 50%; background: #b04f3e; vertical-align: .62em; margin-left: .02em; }
  .url { position: absolute; left: 0; right: 0; top: calc(50% + 72px); text-align: center;
    font: 400 30px/1 InterS, system-ui, sans-serif; color: #5f625c; letter-spacing: .04em; }
  #hook, #outro { position: absolute; inset: 0; opacity: 0; }
</style>
<div id="hook"><div class="halo"></div><div class="line">Every building in Sydney, by the year it was built.</div></div>
<div id="outro"><div class="halo"></div><div class="name">SydMap<i></i></div><div class="url">sydmap.thethirdscript.com</div></div>
<script>
  const HOOK = [0.0, 3.2], OUTRO_IN = window.OUTRO_IN;
  const ease = u => u < 0 ? 0 : u > 1 ? 1 : u * u * (3 - 2 * u);
  function fade(t, a, inD, b, outD) { return Math.min(ease((t - a) / inD), ease((b - t) / outD)); }
  // t is the output time; the hook lives in 0–3.2 s, the outro from its window start to the end
  window.render = t => {
    const h = document.getElementById('hook'), o = document.getElementById('outro');
    h.style.opacity = fade(t, 0.5, 0.7, 2.75, 0.45);
    const y = 1 - fade(t, 0.5, 0.7, 2.75, 0.45);
    h.querySelector('.line').style.transform = `translateY(calc(-50% + ${y * 10}px))`;
    const o0 = window.OUTRO_T0 ?? 19.5;
    o.style.opacity = fade(t, o0, 1.0, 1e9, 1);
    o.querySelector('.name').style.transform = `translateY(calc(-84% + ${(1 - ease((t - o0) / 1.3)) * 14}px))`;
    o.querySelector('.url').style.opacity = ease((t - o0 - 0.5) / 1.0);
  };
</script>
